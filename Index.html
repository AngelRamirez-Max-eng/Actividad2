<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty System - UCAB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-brand">RAM System</div>
        <nav class="nav-links" id="nav-links">
            <!-- Se generará dinámicamente según el estado de autenticación -->
        </nav>
        <button id="theme-toggle" class="btn-theme" aria-label="Cambiar tema">🌓</button>
    </header>

    <main id="app-content" class="container">
        <!-- Las vistas dinámicas se renderizan aquí -->
    </main>

    <!-- Modal global para Detalle / Edición -->
    <div id="global-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Registrar el Service Worker para modo Offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito', reg.scope))
                    .catch(err => console.error('Error al registrar Service Worker', err));
            });
        }
    </script>
</body>
</html>
